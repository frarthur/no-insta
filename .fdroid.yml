Categories:
  - Communication
License: MIT
SourceCode: https://github.com/frarthur/no-insta
IssueTracker: https://github.com/frarthur/no-insta/issues

AutoName: NoInsta
Summary: Instagram without feed or reels, just your messages.
Description: |
  NoInsta is a lightweight Instagram client focused on direct messages.
  No feed, no reels, just conversations.

  The app opens directly on the DM inbox. Home and Reels tabs are hidden
  and redirect to your profile. Native voice recorder and photo picker
  replace the broken web equivalents.

RepoType: git
Repo: https://github.com/frarthur/no-insta.git

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-java-alternatives -a
    init: flutter pub get
    subdir: .
    gradle:
      - yes
    output: build/app/outputs/flutter-apk/app-release.apk

AntiFeatures: []
